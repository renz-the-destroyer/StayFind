<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayFind - Complete Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css?family=Montserrat:400,800');
        * { box-sizing: border-box; }

        body {
            background: #e0f2f1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .dashboard-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.1);
            width: 500px;
            max-width: 100%;
            padding: 40px;
            text-align: center;
        }

        .brand-logo {
            font-size: 2rem;
            color: #0d47a1;
            font-weight: 800;
            margin-bottom: 20px;
        }
        .brand-logo span { color: #42a5f5; }

        h2 { color: #0d47a1; margin-bottom: 10px; }
        p { font-size: 14px; color: #546e7a; margin-bottom: 30px; }

        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 12px; font-weight: bold; color: #0d47a1; margin-left: 5px; }

        input, select {
            background-color: #e3f2fd;
            border: none;
            padding: 12px 15px;
            margin-top: 5px;
            width: 100%;
            border-radius: 5px;
            outline-color: #42a5f5;
            font-family: inherit;
        }

        .role-selection {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .role-option {
            flex: 1;
            padding: 10px;
            border: 2px solid #e3f2fd;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
            font-weight: bold;
            color: #546e7a;
        }

        .role-option.active {
            border-color: #0d47a1;
            background-color: #e3f2fd;
            color: #0d47a1;
        }

        button {
            border-radius: 20px;
            border: 1px solid #0d47a1;
            background-color: #0d47a1;
            color: #FFFFFF;
            font-size: 12px;
            font-weight: bold;
            padding: 12px 45px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: transform 80ms ease-in;
        }

        button:active { transform: scale(0.95); }
        .logout-btn { background: none; border: none; color: #90a4ae; text-decoration: underline; font-size: 12px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="brand-logo">Stay<span>Find</span></div>
        <h2>Welcome!</h2>
        <p>Please complete your profile to continue.</p>

        <form id="profileForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Complete Address</label>
                <input type="text" id="address" placeholder="Bldg, Street, City" required>
            </div>

            <div class="form-group">
                <label>Contact Number</label>
                <input type="tel" id="contact" placeholder="09XXXXXXXXX" required>
            </div>

            <div class="form-group">
                <label>I am a:</label>
                <div class="role-selection">
                    <div class="role-option" id="optTenant" onclick="setRole('tenant')">Tenant</div>
                    <div class="role-option" id="optLandlord" onclick="setRole('landlord')">Landlord</div>
                </div>
            </div>

            <button type="submit" id="saveBtn">Save Profile</button>
        </form>

        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Use your same config here
    const firebaseConfig = {
        apiKey: "AIzaSyD7v_LWg5_I_Y_m-iUIWa09cade8JTkgHk",
        authDomain: "stayfind-f7a28.firebaseapp.com",
        projectId: "stayfind-f7a28",
        databaseURL: "https://stayfind-f7a28-default-rtdb.asia-southeast1.firebasedatabase.app",
        storageBucket: "stayfind-f7a28.firebasestorage.app",
        messagingSenderId: "682175949982",
        appId: "1:682175949982:web:e05561d627caaf3d5d5f8f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUid = null;
    let selectedRole = null;

    // Check if user is logged in
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUid = user.uid;
            // Pre-fill name if available from Google/Registration
            if (user.displayName) document.getElementById('fullName').value = user.displayName;
            
            // Check if profile is already complete
            const snapshot = await get(ref(db, 'users/' + user.uid));
            if (snapshot.exists() && snapshot.val().profileComplete) {
                // If already complete, you could redirect to a main page
                // window.location.href = "main_feed.html";
                console.log("Profile already complete");
            }
        } else {
            window.location.href = "index.html"; // Redirect to login if not authenticated
        }
    });

    // Role Selection Logic
    window.setRole = (role) => {
        selectedRole = role;
        document.getElementById('optTenant').classList.remove('active');
        document.getElementById('optLandlord').classList.remove('active');
        document.getElementById('opt' + role.charAt(0).toUpperCase() + role.slice(1)).classList.add('active');
    };

    // Save Profile Logic
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!selectedRole) {
            return Swal.fire('Wait!', 'Please select if you are a Tenant or Landlord.', 'warning');
        }

        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerText = "Saving...";

        try {
            await update(ref(db, 'users/' + currentUid), {
                displayName: document.getElementById('fullName').value,
                address: document.getElementById('address').value,
                contact: document.getElementById('contact').value,
                userType: selectedRole,
                profileComplete: true,
                updatedAt: new Date().toISOString()
            });

            Swal.fire({
                icon: 'success',
                title: 'Profile Updated!',
                text: 'Your account is now ready.',
                confirmButtonColor: '#0d47a1'
            }).then(() => {
                // Redirect to your actual app home/feed
                // window.location.href = "home.html";
            });

        } catch (error) {
            Swal.fire('Error', error.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerText = "Save Profile";
        }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
        signOut(auth).then(() => window.location.href = "index.html");
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayFind - Login & Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css?family=Montserrat:400,800');
        * { box-sizing: border-box; }

        body {
            background: #e0f2f1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            margin: 0;
        }

        .brand-logo {
            margin-bottom: 20px;
            font-size: 2.5rem;
            color: #0d47a1;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .brand-logo span { color: #42a5f5; }

        h1 { font-weight: bold; margin: 0; color: #0d47a1; }
        p { font-size: 14px; font-weight: 300; line-height: 20px; letter-spacing: 0.5px; margin: 20px 0 30px; }
        span { font-size: 12px; color: #546e7a; margin-bottom: 10px; }

        button {
            border-radius: 20px;
            border: 1px solid #0d47a1;
            background-color: #0d47a1;
            color: #FFFFFF;
            font-size: 12px;
            font-weight: bold;
            padding: 12px 45px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 80ms ease-in, background 0.2s;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover { background-color: #1565c0; }
        button:active { transform: scale(0.95); }
        button:disabled { background-color: #b0bec5; border-color: #b0bec5; cursor: not-allowed; }
        button.ghost { background-color: transparent; border-color: #FFFFFF; }

        form {
            background-color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 50px;
            height: 100%;
            text-align: center;
        }

        input {
            background-color: #e3f2fd;
            border: none;
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            border-radius: 5px;
            outline-color: #42a5f5;
        }

        .container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.1), 0 10px 10px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            width: 768px;
            max-width: 100%;
            min-height: 520px; 
        }

        .form-container { position: absolute; top: 0; height: 100%; transition: all 0.6s ease-in-out; }
        .sign-in-container { left: 0; width: 50%; z-index: 2; }
        .container.right-panel-active .sign-in-container { transform: translateX(100%); }
        .sign-up-container { left: 0; width: 50%; opacity: 0; z-index: 1; }
        .container.right-panel-active .sign-up-container {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {
            0%, 49.99% { opacity: 0; z-index: 1; }
            50%, 100% { opacity: 1; z-index: 5; }
        }

        .overlay-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.6s ease-in-out;
            z-index: 100;
        }

        .container.right-panel-active .overlay-container { transform: translateX(-100%); }

        .overlay {
            background: linear-gradient(to right, #0d47a1, #42a5f5);
            color: #FFFFFF;
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .container.right-panel-active .overlay { transform: translateX(50%); }

        .overlay-panel {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transition: transform 0.6s ease-in-out;
        }

        .overlay-left { transform: translateX(-20%); }
        .container.right-panel-active .overlay-left { transform: translateX(0); }
        .overlay-right { right: 0; transform: translateX(0); }
        .container.right-panel-active .overlay-right { transform: translateX(20%); }

        .social-login-container { margin: 15px 0; display: flex; gap: 10px; }
        .btn-social {
            border: 1px solid #ddd;
            border-radius: 5px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 10px 15px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.3s ease;
            cursor: pointer;
        }

        .btn-fb { background-color: #1877F2; color: white; border: none; }
        .btn-google { background-color: #fff; color: #757575; border: 1px solid #ddd; }
        .btn-social i { margin-right: 8px; }
    </style>
</head>
<body>

    <div class="brand-logo">Stay<span>Find</span></div>

    <div class="container" id="container">
        <div class="form-container sign-up-container">
            <form id="signUpForm">
                <h1>Create Account</h1>
                <div class="social-login-container">
                    <a class="btn-social btn-google google-trigger"><i class="fab fa-google"></i> Gmail</a>
                </div>
                <span>or use your email for registration</span>
                <input type="text" id="regName" placeholder="Name" required />
                <input type="email" id="regEmail" placeholder="Email" required />
                <input type="password" id="regPassword" placeholder="Password (min 6 chars)" required />
                <button type="submit" id="signUpBtn">Sign Up</button>
            </form>
        </div>

        <div class="form-container sign-in-container">
            <form id="signInForm">
                <h1>Sign in</h1>
                <div class="social-login-container">
                    <a class="btn-social btn-google google-trigger"><i class="fab fa-google"></i> Gmail</a>
                </div>
                <span>or use your account</span>
                <input type="email" id="loginEmail" placeholder="Email" required />
                <input type="password" id="loginPassword" placeholder="Password" required />
                <a href="#" id="forgotPass" style="font-size: 12px; color: #546e7a; text-decoration: none; margin-top: 5px;">Forgot your password?</a>
                <button type="submit" id="signInBtn">Sign In</button>
            </form>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1 style="color: white;">Welcome Back!</h1>
                    <p>To keep connected with StayFind please login with your personal info</p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1 style="color: white;">Hello, Friend!</h1>
                    <p>Enter your details and start your journey with StayFind today</p>
                    <button class="ghost" id="signUp">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getAuth, 
        signInWithPopup, 
        GoogleAuthProvider, 
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        updateProfile,
        onAuthStateChanged,
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7v_LWg5_I_Y_m-iUIWa09cade8JTkgHk",
        authDomain: "stayfind-f7a28.firebaseapp.com",
        projectId: "stayfind-f7a28",
        databaseURL: "https://stayfind-f7a28-default-rtdb.asia-southeast1.firebasedatabase.app",
        storageBucket: "stayfind-f7a28.firebasestorage.app",
        messagingSenderId: "682175949982",
        appId: "1:682175949982:web:e05561d627caaf3d5d5f8f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const googleProvider = new GoogleAuthProvider();
    const container = document.getElementById('container');

    // 1. AUTO-REDIRECT LOGIC
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.href = "dashboard.html";
        }
    });

    async function saveUserToDatabase(user, name) {
    try {
        // Use user.displayName if name isn't passed (important for Google Login)
        const finalName = name || user.displayName || "New User";
        await set(ref(db, 'users/' + user.uid), {
            uid: user.uid,
            displayName: finalName,
            email: user.email,
            role: "user",
            lastLogin: serverTimestamp()
        });
    } catch (error) { console.error("DB Error: ", error); }
}

    // 2. SIGN UP WITH LOADING STATE
    document.getElementById('signUpForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('signUpBtn');
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;

        btn.disabled = true;
        btn.innerText = "Creating...";

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            await updateProfile(userCredential.user, { displayName: name });
            await saveUserToDatabase(userCredential.user, name);
            
            Swal.fire({ icon: 'success', title: 'Welcome!', text: 'Account created successfully.', timer: 2000, showConfirmButton: false });
        } catch (error) {
            btn.disabled = false;
            btn.innerText = "Sign Up";
            Swal.fire({ icon: 'error', title: 'Registration Failed', text: error.message });
        }
    });

    /// 3. SIGN IN WITH LOADING STATE
    document.getElementById('signInForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('signInBtn');
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        btn.disabled = true;
        btn.innerText = "Authenticating...";

        try {
            await signInWithEmailAndPassword(auth, email, password);
            Swal.fire({ icon: 'success', title: 'Success', text: 'Logging you in...', timer: 1500, showConfirmButton: false });
        } catch (error) {
            btn.disabled = false;
            btn.innerText = "Sign In";
            let msg = "Invalid email or password.";
            
            // Modern Firebase uses 'invalid-credential' for both
            if(error.code === 'auth/invalid-credential') msg = "The email or password you entered is incorrect.";
            if(error.code === 'auth/too-many-requests') msg = "Too many failed attempts. Try again later.";
            
            Swal.fire({ icon: 'error', title: 'Login Error', text: msg });
        }
    });

    // 4. FORGOT PASSWORD FEATURE
    document.getElementById('forgotPass').addEventListener('click', async (e) => {
        e.preventDefault();
        const { value: email } = await Swal.fire({
            title: 'Reset Password',
            input: 'email',
            inputLabel: 'Enter your email address',
            inputPlaceholder: 'email@example.com',
            showCancelButton: true
        });

        if (email) {
            try {
                await sendPasswordResetEmail(auth, email);
                Swal.fire('Sent!', 'Check your inbox for password reset instructions.', 'success');
            } catch (error) {
                Swal.fire('Error', error.message, 'error');
            }
        }
    });

    // Google Login
document.querySelectorAll('.google-trigger').forEach(btn => {
    btn.addEventListener('click', async () => {
        try {
            const result = await signInWithPopup(auth, googleProvider);
            // Pass the user object directly; the function above now handles the name better
            await saveUserToDatabase(result.user);
            Swal.fire({ icon: 'success', title: 'Success', text: 'Welcome!', timer: 1500, showConfirmButton: false });
        } catch (error) { 
            if (error.code !== 'auth/cancelled-popup-request') {
                Swal.fire('Google Error', error.message, 'error'); 
            }
        }
    });
});

    // UI Animations
    document.getElementById('signUp').addEventListener('click', () => container.classList.add("right-panel-active"));
    document.getElementById('signIn').addEventListener('click', () => container.classList.remove("right-panel-active"));
</script>
</body>
</html>
